const home=document.getElementById('home'),work=document.getElementById('workspace'),back=document.getElementById('back'),topTitle=document.getElementById('topTitle');
function decode(s){const raw=atob(s);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
const frames=APPS.map((app,i)=>{const btn=document.createElement('button');btn.className='card';const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=app.icon;const name=document.createElement('span');name.className='name';name.textContent=app.title;const desc=document.createElement('span');desc.className='desc';desc.textContent=app.desc;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='Mở ứng dụng →';btn.append(emoji,name,desc,arrow);btn.onclick=()=>openApp(i);document.getElementById('cards').append(btn);const frame=document.createElement('iframe');frame.title=app.title;frame.setAttribute('allow','microphone; autoplay');frame.setAttribute('referrerpolicy','no-referrer');work.append(frame);return frame});
function openApp(i){const f=frames[i];if(!f.dataset.loaded){f.srcdoc=decode(APPS[i].data);f.dataset.loaded='1'}frames.forEach((x,j)=>x.classList.toggle('active',i===j));home.style.display='none';work.style.display='block';back.style.display='inline-block';topTitle.textContent=APPS[i].icon+' '+APPS[i].title;window.scrollTo(0,0)}
function goHome(){frames.forEach(f=>f.classList.remove('active'));home.style.display='block';work.style.display='none';back.style.display='none';topTitle.textContent='📚 Trung tâm học ngoại ngữ';window.scrollTo(0,0)}back.onclick=goHome;
</script><script>
/* PWA shell only; original four embedded apps remain unchanged. */
if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(reg => {
  reg.addEventListener('updatefound', () => {
   const worker=reg.installing;
   if(worker) worker.addEventListener('statechange', () => {
    if(worker.state==='installed' && navigator.serviceWorker.controller) {
     const notice=document.createElement('div');notice.setAttribute('role','status');
     notice.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;z-index:99999;background:#14263d;color:#fff;padding:14px;border-radius:12px;box-shadow:0 4px 18px #0004;text-align:center';
     notice.textContent='Đã có phiên bản mới. Hãy lưu công việc trước khi cập nhật. ';
     const btn=document.createElement('button');btn.textContent='Cập nhật';btn.style.cssText='margin-left:12px;padding:8px 14px;border:0;border-radius:8px;cursor:pointer';
     btn.onclick=()=>worker.postMessage({type:'SKIP_WAITING'});notice.append(btn);document.body.append(notice);
    }
   });
  });
 }).catch(err=>console.warn('PWA Service Worker:',err)));
 let refreshing=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
}
